[project]
name = "xquant-learning-sxl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas-stubs~=3.0.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
download = ["yfinance>=0.2"]
notebooks = ["nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backtest*"]

[tool.setuptools.package-data]
backtest = ["config/default.yaml", "config/legacy.yaml", "config/us.yaml", "config/yfinance.yaml"]

[tool.setuptools.exclude-package-data]
"*" = ["*.local.yaml", "config/*.local.yaml"]
